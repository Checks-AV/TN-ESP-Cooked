<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 Traffic Monitor — Ticket Rail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Courier+Prime:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --steel-dark:#24282b; --steel:#2f3438;
    --line:rgba(255,255,255,0.08);
    --good:#4a9d6e; --bad:#d9463c; --warn:#dfa62e; --info:#4a6a9d;
    --panel:rgba(255,255,255,0.03); --panel-line:rgba(255,255,255,0.06);
  }
  * { box-sizing:border-box; }
  html, body{ height:100%; margin:0; }
  body{
    background: radial-gradient(ellipse at top, #363c40 0%, var(--steel-dark) 60%);
    font-family:'Inter', sans-serif; color:#e9e6de;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 16px 24px; border-bottom:1px solid var(--line); flex-shrink:0;
  }
  h1{
    font-family:'Bebas Neue', sans-serif; font-size:26px; letter-spacing:2px;
    margin:0; color:#f5f2ea;
  }
  .sub{ font-size:11px; color:#8a8f92; letter-spacing:1px; text-transform:uppercase; }
  .conn-status{
    display:flex; align-items:center; gap:8px; font-size:12px; color:#b5aea0;
  }
  .dot{ width:9px; height:9px; border-radius:50%; background:#6b6558; }
  .dot.connected{ background:var(--good); box-shadow:0 0 8px var(--good); }
  .dot.error{ background:var(--bad); box-shadow:0 0 8px var(--bad); }

  .layout{ flex:1; display:flex; overflow:hidden; }

  /* ── SIDEBAR: device tabs ── */
  .sidebar{
    width:250px; flex-shrink:0; border-right:1px solid var(--line);
    overflow-y:auto; padding:12px;
  }
  .sidebar-section-label{
    font-size:10px; color:#6b6558; text-transform:uppercase; letter-spacing:0.5px;
    padding:6px 4px 4px; margin-top:4px;
  }
  .tab{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 10px; border-radius:8px; margin-bottom:4px; cursor:pointer;
    border:1px solid transparent; transition:0.12s; gap:6px;
  }
  .tab:hover{ background:rgba(255,255,255,0.04); }
  .tab:hover .tab-actions{ opacity:1; }
  .tab.active{ background:rgba(74,157,110,0.12); border-color:rgba(74,157,110,0.35); }
  .tab.muted{ opacity:0.55; }
  .tab-info{ overflow:hidden; flex:1; }
  .tab-mac{
    font-family:'Courier Prime', monospace; font-size:12px; color:#f5f2ea;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    display:flex; align-items:center; gap:5px;
  }
  .tab-station{ font-size:10px; color:#8a8f92; text-transform:uppercase; letter-spacing:0.5px; margin-top:2px; }
  .tab-badge{
    background:rgba(255,255,255,0.08); color:#e9e6de; font-size:10px; font-weight:700;
    padding:2px 7px; border-radius:10px; flex-shrink:0;
  }
  .tab-badge.new{ background:var(--good); color:#12241a; }
  .tab-badge.muted-count{ background:rgba(223,166,46,0.2); color:var(--warn); }
  .mute-icon{ font-size:10px; opacity:0.8; }

  .tab-actions{
    display:flex; gap:4px; opacity:0; transition:0.12s; flex-shrink:0;
  }
  .tab.active .tab-actions{ opacity:1; }
  .icon-btn{
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08);
    color:#b5aea0; width:22px; height:22px; border-radius:5px; cursor:pointer;
    font-size:11px; display:flex; align-items:center; justify-content:center;
    line-height:1; padding:0;
  }
  .icon-btn:hover{ background:rgba(255,255,255,0.12); color:#f5f2ea; }
  .icon-btn.active-toggle{ background:rgba(223,166,46,0.2); border-color:rgba(223,166,46,0.4); color:var(--warn); }

  .sidebar-empty{ color:#6b6558; font-size:12px; padding:20px 8px; text-align:center; line-height:1.6; }

  .hidden-summary{
    margin-top:10px; padding:8px 10px; border-radius:8px; background:rgba(255,255,255,0.02);
    border:1px dashed rgba(255,255,255,0.1); font-size:11px; color:#8a8f92; cursor:pointer;
  }
  .hidden-summary:hover{ color:#e9e6de; border-color:rgba(255,255,255,0.2); }

  /* ── MAIN LOG PANEL ── */
  .main{ flex:1; display:flex; flex-direction:column; overflow:hidden; }
  .main-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 20px; border-bottom:1px solid var(--line); flex-shrink:0;
  }
  .main-head h2{
    font-family:'Bebas Neue', sans-serif; font-size:18px; letter-spacing:1px; margin:0;
    display:flex; align-items:center; gap:8px;
  }
  .main-head .meta{ font-size:11px; color:#8a8f92; font-family:'Courier Prime',monospace; margin-top:2px; }
  .head-btns{ display:flex; gap:8px; }
  .clear-btn, .mute-btn, .hide-btn{
    background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); color:#b5aea0;
    padding:6px 16px; border-radius:16px; font-size:11px; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .clear-btn:hover, .mute-btn:hover, .hide-btn:hover{ background:rgba(255,255,255,0.08); color:#f5f2ea; }
  .mute-btn.on{ background:rgba(223,166,46,0.18); border-color:rgba(223,166,46,0.4); color:var(--warn); }

  .muted-banner{
    margin:12px 20px 0; padding:8px 12px; border-radius:8px;
    background:rgba(223,166,46,0.1); border:1px solid rgba(223,166,46,0.3);
    color:var(--warn); font-size:12px; display:flex; justify-content:space-between; align-items:center;
  }
  .muted-banner button{
    background:none; border:1px solid rgba(223,166,46,0.5); color:var(--warn);
    padding:3px 10px; border-radius:12px; font-size:11px; cursor:pointer;
  }

  .log{ flex:1; overflow-y:auto; padding:16px 20px; }
  .log-empty{ color:#6b6558; font-size:13px; text-align:center; padding:60px 0; }

  .entry{
    border-radius:8px; padding:10px 12px; margin-bottom:8px;
    font-family:'Courier Prime', monospace; font-size:12px;
    border-left:3px solid #4a5054; background:rgba(0,0,0,0.2);
  }
  .entry.phase-received{ border-left-color:var(--info); }
  .entry.phase-result-ok{ border-left-color:var(--good); }
  .entry.phase-result-err{ border-left-color:var(--bad); }
  .entry .meta{
    display:flex; justify-content:space-between; color:#8a8f92; font-size:10px; margin-bottom:6px;
    flex-wrap:wrap; gap:6px;
  }
  .entry .route{ color:#f5f2ea; font-weight:700; }
  .entry .mac{ color:#dfa62e; }
  .entry pre{ margin:0; white-space:pre-wrap; word-break:break-all; color:#d8d4c8; }
  .badge{
    display:inline-block; padding:1px 8px; border-radius:10px; font-size:10px; font-weight:700;
  }
  .badge.received{ background:rgba(74,106,157,0.25); color:#8fb0e8; }
  .badge.ok{ background:rgba(74,157,110,0.2); color:var(--good); }
  .badge.err{ background:rgba(217,70,60,0.2); color:var(--bad); }
</style>
</head>
<body>

<header>
  <div>
    <h1>ESP32 Traffic Monitor</h1>
    <div class="sub">Every message, auto-sorted by device</div>
  </div>
  <div class="conn-status">
    <span class="dot" id="connDot"></span>
    <span id="connLabel">connecting…</span>
  </div>
</header>

<div class="layout">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-empty" id="sidebarEmpty">No ESP32 traffic yet.<br>Waiting for a device to register or send a message.</div>
  </div>

  <div class="main">
    <div class="main-head">
      <div>
        <h2 id="mainTitle">All devices</h2>
        <div class="meta" id="mainMeta">Interleaved view of every device</div>
      </div>
      <div class="head-btns" id="headBtns">
        <button class="clear-btn" onclick="clearActive()">Clear this view</button>
      </div>
    </div>
    <div id="mutedBannerSlot"></div>
    <div class="log" id="log">
      <div class="log-empty">Waiting for ESP32 traffic…</div>
    </div>
  </div>
</div>

<script>
  // deviceKey -> { mac, station, entries: [], unread, hidden, muted, mutedCount }
  // hidden/muted state lives only in this tab's memory — reloading the
  // page or restarting the server both reset it. That's intentional:
  // this is a decluttering tool for the live view, not device config.
  const devices = new Map();
  const ALL_KEY = '__all__';
  devices.set(ALL_KEY, { mac: 'All devices', station: null, entries: [], unread: 0, hidden: false, muted: false, mutedCount: 0 });

  let activeKey = ALL_KEY;

  const sidebar = document.getElementById('sidebar');
  const sidebarEmpty = document.getElementById('sidebarEmpty');
  const log = document.getElementById('log');
  const mainTitle = document.getElementById('mainTitle');
  const mainMeta = document.getElementById('mainMeta');
  const headBtns = document.getElementById('headBtns');
  const mutedBannerSlot = document.getElementById('mutedBannerSlot');
  const connDot = document.getElementById('connDot');
  const connLabel = document.getElementById('connLabel');

  function keyFor(mac) {
    return mac || '__unknown__';
  }

  function ensureDevice(mac, station) {
    const key = keyFor(mac);
    if (!devices.has(key)) {
      devices.set(key, {
        mac: mac || 'Unknown device',
        station: station || null,
        entries: [],
        unread: 0,
        hidden: false,
        muted: false,
        mutedCount: 0
      });
      renderSidebar();
    } else if (station && !devices.get(key).station) {
      devices.get(key).station = station;
      renderSidebar();
    }
    return key;
  }

  function renderSidebar() {
    const existingTabs = sidebar.querySelectorAll('.tab, .hidden-summary, .sidebar-section-label');
    existingTabs.forEach(t => t.remove());

    const visible = [...devices.entries()]
      .filter(([key]) => key !== ALL_KEY)
      .filter(([, dev]) => !dev.hidden)
      .sort((a, b) => a[1].mac.localeCompare(b[1].mac));

    const hiddenList = [...devices.entries()]
      .filter(([key]) => key !== ALL_KEY)
      .filter(([, dev]) => dev.hidden);

    sidebarEmpty.style.display = (devices.size <= 1) ? 'block' : 'none';

    appendTab(ALL_KEY, devices.get(ALL_KEY));
    visible.forEach(([key, dev]) => appendTab(key, dev));

    if (hiddenList.length > 0) {
      const summary = document.createElement('div');
      summary.className = 'hidden-summary';
      summary.textContent = `${hiddenList.length} device${hiddenList.length > 1 ? 's' : ''} cleared — click to restore all`;
      summary.onclick = () => {
        hiddenList.forEach(([key]) => devices.get(key).hidden = false);
        renderSidebar();
      };
      sidebar.appendChild(summary);
    }
  }

  function appendTab(key, dev) {
    const el = document.createElement('div');
    el.className = 'tab' + (key === activeKey ? ' active' : '') + (dev.muted ? ' muted' : '');
    el.onclick = () => selectDevice(key);

    const badge = dev.muted
      ? (dev.mutedCount > 0 ? `<span class="tab-badge muted-count">${dev.mutedCount} muted</span>` : '')
      : (dev.unread > 0 ? `<span class="tab-badge new">${dev.unread}</span>` : (dev.entries.length ? `<span class="tab-badge">${dev.entries.length}</span>` : ''));

    const actions = key === ALL_KEY ? '' : `
      <div class="tab-actions">
        <button class="icon-btn${dev.muted ? ' active-toggle' : ''}" title="${dev.muted ? 'Unmute' : 'Mute'}" onclick="toggleMute('${key}', event)">${dev.muted ? '🔇' : '🔈'}</button>
        <button class="icon-btn" title="Clear from list" onclick="hideDevice('${key}', event)">✕</button>
      </div>
    `;

    el.innerHTML = `
      <div class="tab-info">
        <div class="tab-mac">${dev.mac}${dev.muted ? '<span class="mute-icon">muted</span>' : ''}</div>
        ${dev.station ? `<div class="tab-station">${dev.station}</div>` : ''}
      </div>
      ${badge}
      ${actions}
    `;
    sidebar.appendChild(el);
  }

  function hideDevice(key, evt) {
    evt.stopPropagation();
    const dev = devices.get(key);
    if (!dev) return;
    dev.hidden = true;
    if (activeKey === key) selectDevice(ALL_KEY);
    renderSidebar();
  }

  function toggleMute(key, evt) {
    if (evt) evt.stopPropagation();
    const dev = devices.get(key);
    if (!dev) return;
    dev.muted = !dev.muted;
    if (!dev.muted) dev.mutedCount = 0;
    renderSidebar();
    if (activeKey === key) selectDevice(key); // refresh header/banner state
  }

  function selectDevice(key) {
    activeKey = key;
    const dev = devices.get(key);
    dev.unread = 0;
    if (dev.muted) dev.mutedCount = 0;

    mainTitle.innerHTML = key === ALL_KEY
      ? 'All devices'
      : `${dev.mac}`;
    mainMeta.textContent = key === ALL_KEY
      ? 'Interleaved view of every device'
      : (dev.station ? `Station: ${dev.station}` : 'Station: unassigned');

    renderHeadBtns(key, dev);
    renderSidebar();
    renderLog();
  }

  function renderHeadBtns(key, dev) {
    headBtns.innerHTML = '';

    if (key !== ALL_KEY) {
      const muteBtn = document.createElement('button');
      muteBtn.className = 'mute-btn' + (dev.muted ? ' on' : '');
      muteBtn.textContent = dev.muted ? 'Unmute' : 'Mute';
      muteBtn.onclick = () => toggleMute(key);
      headBtns.appendChild(muteBtn);

      const hideBtn = document.createElement('button');
      hideBtn.className = 'hide-btn';
      hideBtn.textContent = 'Clear from list';
      hideBtn.onclick = () => hideDevice(key, { stopPropagation(){} });
      headBtns.appendChild(hideBtn);
    }

    const clearBtn = document.createElement('button');
    clearBtn.className = 'clear-btn';
    clearBtn.textContent = 'Clear this view';
    clearBtn.onclick = () => clearActive();
    headBtns.appendChild(clearBtn);

    mutedBannerSlot.innerHTML = '';
    if (dev.muted) {
      const banner = document.createElement('div');
      banner.className = 'muted-banner';
      banner.innerHTML = `<span>This device is muted — new messages are being counted but not shown live.</span>`;
      const btn = document.createElement('button');
      btn.textContent = 'Unmute';
      btn.onclick = () => toggleMute(key);
      banner.appendChild(btn);
      mutedBannerSlot.appendChild(banner);
    }
  }

  function clearActive() {
    devices.get(activeKey).entries = [];
    renderLog();
    renderSidebar();
  }

  function classify(event) {
    if (event.phase === 'received') return { cls: 'phase-received', badge: 'received', label: 'RECEIVED' };
    const ok = event.status && event.status < 400;
    return ok
      ? { cls: 'phase-result-ok', badge: 'ok', label: String(event.status) }
      : { cls: 'phase-result-err', badge: 'err', label: String(event.status || 'ERR') };
  }

  function renderEntry(event) {
    const { cls, badge, label } = classify(event);
    const time = new Date(event.timestamp).toLocaleTimeString();
    const div = document.createElement('div');
    div.className = `entry ${cls}`;
    div.innerHTML = `
      <div class="meta">
        <span><span class="route">${event.route}</span> · <span class="mac">${event.device_mac || 'unknown'}</span> · ${event.message_type}</span>
        <span><span class="badge ${badge}">${label}</span> ${time}</span>
      </div>
      <pre>${JSON.stringify(event.payload, null, 2)}</pre>
    `;
    return div;
  }

  function renderLog() {
    log.innerHTML = '';
    const dev = devices.get(activeKey);
    if (!dev || dev.entries.length === 0) {
      log.innerHTML = '<div class="log-empty">No messages yet for this view.</div>';
      return;
    }
    dev.entries.forEach(event => log.appendChild(renderEntry(event)));
    log.scrollTop = log.scrollHeight;
  }

  function handleEvent(event) {
    const key = ensureDevice(event.device_mac, null);
    const dev = devices.get(key);

    // A device that had been cleared from the sidebar reappears the
    // instant it sends anything new — clearing only hides it while
    // it's quiet, it never permanently drops a device.
    if (dev.hidden) {
      dev.hidden = false;
    }

    // Always keep history, even while muted, so unmuting (or clicking
    // into the tab) shows the full picture rather than gaps.
    dev.entries.push(event);
    devices.get(ALL_KEY).entries.push(event);

    if (dev.muted) {
      // Muted: count quietly, don't badge, don't live-append anywhere.
      dev.mutedCount++;
      renderSidebar();
      return;
    }

    if (key !== activeKey) dev.unread++;
    if (ALL_KEY !== activeKey) devices.get(ALL_KEY).unread++;

    if (activeKey === key || activeKey === ALL_KEY) {
      const placeholder = log.querySelector('.log-empty');
      if (placeholder) placeholder.remove();
      log.appendChild(renderEntry(event));
      log.scrollTop = log.scrollHeight;
    }

    renderSidebar();
  }

  // ── SSE connection ──
  function connect() {
    const sse = new EventSource('/api/esp-monitor/stream');

    sse.onopen = () => {
      connDot.className = 'dot connected';
      connLabel.textContent = 'connected';
    };

    sse.onerror = () => {
      connDot.className = 'dot error';
      connLabel.textContent = 'reconnecting…';
    };

    sse.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === 'history' || msg.type === 'live') {
          handleEvent(msg.event);
        }
      } catch (err) {
        console.error('Failed to parse SSE event', err, e.data);
      }
    };
  }

  // Pre-populate device tabs from known devices, so tabs exist even
  // before any live traffic arrives in this session.
  fetch('/api/esp-monitor/devices')
    .then(r => r.json())
    .then(data => {
      (data.devices || []).forEach(d => ensureDevice(d.device_mac, d.station_name));
    })
    .catch(() => {});

  renderHeadBtns(ALL_KEY, devices.get(ALL_KEY));
  renderSidebar();
  connect();
</script>

</body>
</html>
